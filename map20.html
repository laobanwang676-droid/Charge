<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>20号宿舍充电桩分布图</title>
	<style>
		:root {
			--ink: #111111;
			--line: #8f6a64;
			--dash: #c6a99f;
			--accent: #d92d20;
			--bg: #ffffff;
			--muted: rgba(217, 45, 32, 0.12);
			--panel: #fffaf8;
			--panel-strong: #fff2ec;
			--shadow: 0 12px 30px rgba(115, 72, 62, 0.10);
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			min-height: 100%;
			background: #f2f2f2;
			color: var(--ink);
			font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
		}

		body {
			display: flex;
			justify-content: center;
			padding: 20px 12px 32px;
		}

		.page {
			width: min(100%, 980px);
			background: linear-gradient(180deg, #fff 0%, #fffdfc 100%);
			padding: 10px 12px 18px;
			position: relative;
			overflow: hidden;
			box-shadow: var(--shadow);
			border: 1px solid rgba(143, 106, 100, 0.12);
			border-radius: 18px;
		}

		.title {
			position: relative;
			z-index: 2;
			text-align: center;
			margin: 48px 0 10px;
			font-size: clamp(30px, 4.5vw, 46px);
			line-height: 1.05;
			font-weight: 900;
			letter-spacing: 0;
		}

		.subtitle {
			margin: 2px 0 10px;
			text-align: center;
			color: var(--accent);
			font-size: clamp(22px, 3vw, 34px);
			line-height: 1.1;
			font-weight: 900;
		}

		.map {
			position: relative;
			width: 100%;
			aspect-ratio: 780 / 1180;
			min-height: 1080px;
			background: #fff;
			margin: -120px auto 0;
			max-width: 820px;
		}

		.road {
			position: absolute;
			left: -2%;
			top: 10.5%;
			bottom: 4%;
			width: 15.5%;
			border-radius: 18px;
			background: linear-gradient(180deg, #f5ede8 0%, #fff 100%);
			border: 1px solid rgba(143, 106, 100, 0.24);
			box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.road span,
		.dorm span,
		.gatehouse span,
		.entry span {
			font-weight: 900;
			letter-spacing: 0;
		}

		.road span {
			font-size: clamp(38px, 6vw, 62px);
		}

		.map-return {
			position: fixed;
			left: 16px;
			top: 16px;
			z-index: 50;
			padding: 10px 14px;
			border-radius: 999px;
			border: 1px solid rgba(143, 106, 100, 0.24);
			background: rgba(255, 255, 255, 0.96);
			color: var(--ink);
			font-weight: 900;
			text-decoration: none;
			cursor: pointer;
			appearance: none;
			box-shadow: 0 8px 18px rgba(115, 72, 62, 0.10);
		}

		.map-return:hover {
			background: #fff;
		}

		.dorm {
			position: absolute;
			right: 0.6%;
			top: 15.5%;
			width: 30.5%;
			height: 60.5%;
			border: 1px solid rgba(143, 106, 100, 0.24);
			border-radius: 20px;
			background: linear-gradient(180deg, var(--panel) 0%, #fff 100%);
			box-shadow: var(--shadow);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.dorm span {
			font-size: clamp(32px, 5vw, 52px);
			line-height: 1.15;
			text-align: center;
		}

		.central {
			position: absolute;
			left: 15.5%;
			top: 10.5%;
			width: 47.0%;
			height: 80%;
		}

		.aisle-outline {
			position: absolute;
			inset: 0;
			border: 1.5px dashed var(--dash);
			border-radius: 18px;
			background: linear-gradient(180deg, rgba(255, 245, 241, 0.34) 0%, rgba(255, 255, 255, 0.68) 100%);
		}

		.aisle-inner {
			position: absolute;
			left: 16.5%;
			right: 16.5%;
			top: 4.8%;
			bottom: 4.8%;
			border: 1.5px dashed rgba(143, 106, 100, 0.7);
			border-radius: 16px;
			background: rgba(255, 255, 255, 0.35);
		}

		.center-divider {
			position: absolute;
			top: 7.5%;
			bottom: 7.5%;
			left: 50%;
			width: 2px;
			background: var(--line);
			transform: translateX(-1px);
		}

		.site {
			position: absolute;
			width: 16%;
			height: auto;
			aspect-ratio: 1;
			border: 1px solid rgba(143, 106, 100, 0.26);
			background: linear-gradient(180deg, #fff 0%, var(--panel-strong) 100%);
			border-radius: 12px;
			box-shadow: 0 8px 18px rgba(115, 72, 62, 0.08);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: clamp(10px, 1.35vw, 14px);
			font-weight: 700;
			line-height: 1.12;
			white-space: normal;
			word-break: keep-all;
			text-align: center;
			padding: 8px 6px;
		}

		.site.empty {
			background: linear-gradient(180deg, #fff 0%, #fff9f7 100%);
			border-style: dashed;
		}

		.site.station-offline {
			background: #f5b8b3;
			border-color: #d92d20;
		}

		.site.station-zero-free {
			background: #b9d9f5;
			border-color: #1976d2;
		}

		.site.station-idle {
			background: #f1f3f4;
			border-color: #c5c9cd;
			color: #111;
		}

		.map-legend {
			display: flex;
			justify-content: center;
			gap: 16px;
			flex-wrap: wrap;
			margin: 8px auto 0;
			font-size: 12px;
			font-weight: 700;
		}

		.map-legend-item {
			display: inline-flex;
			align-items: center;
			gap: 5px;
		}

		.map-legend-swatch {
			width: 14px;
			height: 14px;
			border: 1px solid rgba(17, 17, 17, 0.2);
			border-radius: 3px;
		}

		.map-legend-swatch.default { background: var(--panel-strong); }
		.map-legend-swatch.idle { background: #f1f3f4; border-color: #c5c9cd; }
		.map-legend-swatch.offline { background: #f5b8b3; border-color: #d92d20; }
		.map-legend-swatch.zero-free { background: #b9d9f5; border-color: #1976d2; }

		.left-site { left: 30%; }
		.right-site { right: 30%; }

		.r1 { top: 5.2%; }
		.r2 { top: 15.1%; }
		.r3 { top: 25.4%; }
		.r4 { top: 35.7%; }
		.r5 { top: 46.0%; }
		.r6 { top: 56.3%; }
		.r7 { top: 66.6%; }
		.r8 { top: 76.9%; }
		.r9 { top: 87.2%; }

		.gatehouse {
			position: absolute;
			left: 19.4%;
			bottom: 0.5%;
			width: 13.8%;
			height: 7.5%;
			border: 1px solid rgba(143, 106, 100, 0.24);
			border-radius: 16px;
			background: linear-gradient(180deg, var(--panel) 0%, #fff 100%);
			box-shadow: var(--shadow);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.gatehouse span {
			font-size: clamp(14px, 2vw, 18px);
			white-space: nowrap;
			line-height: 1;
		}

		.entry {
			position: absolute;
			left: 41.2%;
			bottom: 0.9%;
			font-size: clamp(18px, 2.8vw, 24px);
			font-weight: 900;
			padding: 6px 12px;
			border-radius: 999px;
			background: #fff;
			border: 1px solid rgba(143, 106, 100, 0.2);
			box-shadow: 0 6px 16px rgba(115, 72, 62, 0.08);
		}

		@media (max-width: 760px) {
			body {
				display: block;
				padding: 0;
				background: #fff;
				overflow-x: auto;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
			}
			.page {
				width: 860px;
				max-width: none;
				min-height: 100vh;
				padding: 4px 6px 12px;
				box-shadow: none;
				border-radius: 0;
				overflow: visible;
			}
			.map {
				width: 820px;
				max-width: none;
				min-height: 1160px;
				aspect-ratio: auto;
				margin-top: -92px;
			}
			.title {
				position: relative;
				z-index: 2;
				margin: 30px 0 10px;
			}
			.site {
				font-size: clamp(9px, 2.6vw, 12px);
				padding: 8px 5px;
				border-radius: 10px;
			}
			.dorm span {
				font-size: clamp(28px, 8vw, 40px);
			}
			.gatehouse span,
			.entry {
				font-size: clamp(12px, 4.2vw, 18px);
			}
			.road span { writing-mode: vertical-rl; text-orientation: upright; }
			.map-return {
				left: 10px;
				top: 10px;
				padding: 8px 12px;
				font-size: 12px;
			}
			.left-site { left: 30%; }
			.right-site { right: 30%; }
		}
		/* 站点文字下方的空闲数角标 */
		.site {
			flex-direction: column;
		}

		.site .site-free {
			display: block;
			flex: none;
			width: 100%;
			min-height: 0;
			margin-top: 2px;
			color: #1976d2;
			font-size: 0.85em;
			font-weight: 900;
			line-height: 1.05;
			letter-spacing: 0;
			text-align: center;
			white-space: nowrap;
		}

		/* 点击站点弹出的空闲插座气泡 */
		.site-tip {
			position: fixed;
			z-index: 9999;
			min-width: 96px;
			max-width: 230px;
			box-sizing: border-box;
			padding: 9px 22px 9px 11px;
			background: #ffffff;
			border: 1px solid rgba(25, 118, 210, 0.35);
			border-radius: 10px;
			box-shadow: 0 10px 24px rgba(17, 17, 17, 0.18);
			font-size: 12px;
			font-weight: 700;
			line-height: 1.4;
			color: #111;
		}

		.site-tip-head {
			margin-bottom: 5px;
			font-size: 13px;
		}

		.site-tip-head .site-tip-count {
			color: #1976d2;
		}

		.site-tip-list {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}

		.site-tip-num {
			display: inline-block;
			padding: 1px 6px;
			border-radius: 6px;
			background: #e7f1fd;
			color: #0b5cad;
			font-size: 12px;
			font-weight: 800;
		}

		.site-tip-note {
			color: #666;
			font-weight: 600;
		}

		.site-tip-close {
			position: absolute;
			top: 4px;
			right: 4px;
			width: 20px;
			height: 20px;
			padding: 0;
			border: none;
			border-radius: 50%;
			background: transparent;
			color: #999;
			font-size: 16px;
			font-weight: 700;
			line-height: 20px;
			text-align: center;
			cursor: pointer;
		}

		.site-tip-close:hover {
			background: rgba(17, 17, 17, 0.08);
			color: #111;
		}

		/* 点击查看空闲插座提示 */
		.map-hint {
			margin-top: 10px;
			font-size: 12px;
			font-family: "SimHei", "Microsoft YaHei", sans-serif;
			font-weight: 700;
			color: #0d47a1;
			text-align: center;
		}
		.map-hint-note {
			margin-top: 4px;
			color: #000;
			font-weight: 700;
		}
	</style>
</head>
<body>
		<button class="map-return" type="button" onclick="goBackToPreviousPage()">返回</button>
	<main class="page">
		<h1 class="title">东盟充电桩分布图</h1>
		<section class="map" aria-label="东盟充电桩分布图">
			<div class="road"><span>马路</span></div>

			<div class="central">
				<div class="aisle-outline"></div>
				<div class="aisle-inner"></div>
				<div class="center-divider"></div>

				<div class="site left-site r1">28号<br>充电桩</div>
				<div class="site right-site r1">33号<br>充电桩</div>

				<div class="site left-site r2">22号<br>充电桩</div>
				<div class="site right-site r2">31号<br>充电桩</div>

				<div class="site left-site r3">20号<br>充电桩</div>
				<div class="site right-site r3">27号<br>充电桩</div>

				<div class="site left-site r4 empty"></div>
				<div class="site right-site r4">21号<br>充电桩</div>

				<div class="site left-site r5">13号<br>充电桩</div>
				<div class="site right-site r5">15号<br>充电桩</div>

				<div class="site left-site r6">8号<br>充电桩</div>
				<div class="site right-site r6">12号<br>充电桩</div>

				<div class="site left-site r7">7号<br>充电桩</div>
				<div class="site right-site r7">6号<br>充电桩</div>

				<div class="site left-site r8">5号<br>充电桩</div>
				<div class="site right-site r8">4号<br>充电桩</div>

				<div class="site left-site r9">1号<br>充电桩</div>
				<div class="site right-site r9">2号<br>充电桩</div>

			<div class="dorm"><span>20<br>号<br>宿<br>舍</span></div>
			<div class="gatehouse"><span>保安亭</span></div>

		</section>
		<div class="map-legend" aria-label="充电桩状态图例">
			<span class="map-legend-item"><i class="map-legend-swatch default"></i>初始状态</span>
			<span class="map-legend-item"><i class="map-legend-swatch idle"></i>有空闲插座</span>
			<span class="map-legend-item"><i class="map-legend-swatch offline"></i>离线</span>
			<span class="map-legend-item"><i class="map-legend-swatch zero-free"></i>0个空闲</span>
		</div>
		<div class="map-hint"><div>点击有空闲的充电桩，可查看具体是哪些插座空闲</div><div class="map-hint-note">仅为本次查询结果，找到后请确认该插座仍然空闲</div></div>
	</main>
		<script>
		(function () {
			function applyStationStates() {
				var rawStates = new URLSearchParams(window.location.search).get('states');
				if (!rawStates) return;
				var states;
				try { states = JSON.parse(rawStates); } catch (_) { return; }
				document.querySelectorAll('.site:not(.empty)').forEach(function (site) {
					var match = site.textContent.match(/\d+/);
					if (!match || !states[match[0]]) return;
					var status = states[match[0]];
					if (!status.hasStatus) return;
					if (status.state === '离线') site.classList.add('station-offline');
					else if (Number(status.availableCount) === 0) site.classList.add('station-zero-free');
					else if (status.state === '空闲' || Number(status.availableCount) > 0) site.classList.add('station-idle');
				});
			}

			applyStationStates();

		})();

			function goBackToPreviousPage() {
				var referrer = document.referrer;
				var cameFromHome = false;
				try {
					var referrerUrl = referrer ? new URL(referrer, window.location.href) : null;
					cameFromHome = referrerUrl && referrerUrl.origin === window.location.origin
						&& (referrerUrl.pathname.endsWith('/index.html') || referrerUrl.pathname.endsWith('/'));
				} catch (_) {}
				if (cameFromHome && history.length > 1) {
					history.back();
					return;
				}
				window.location.replace('index.html');
			}
		</script>
	<script>
		(function () {
			var rawStates = new URLSearchParams(window.location.search).get('states');
			if (!rawStates) return;
			var states = null;
			try { states = JSON.parse(rawStates); } catch (_) { return; }
			document.querySelectorAll('.site:not(.empty)').forEach(function (site) {
				var match = site.textContent.match(/\d+/);
				var status = match && states[match[0]];
				if (!status || !status.hasStatus) return;
				var freeCount = Number(status.availableCount);
				if (!(freeCount > 0)) return;
				var badge = document.createElement('span');
				badge.className = 'site-free';
				badge.textContent = '空闲数' + freeCount;
				site.appendChild(badge);
			});
		})();
	</script>
	<script>
		(function () {
			var rawStates = new URLSearchParams(window.location.search).get('states');
			var states = null;
			if (rawStates) {
				try { states = JSON.parse(rawStates); } catch (_) { states = null; }
			}

			var tip = null;
			var tipSite = null;

			function closeTip() {
				if (tip) {
					tip.remove();
					tip = null;
				}
				tipSite = null;
			}

			function placeTip(site) {
				if (!tip) return;
				var rect = site.getBoundingClientRect();
				tip.style.visibility = 'hidden';
				tip.style.left = '0px';
				tip.style.top = '0px';
				var tipW = tip.offsetWidth;
				var tipH = tip.offsetHeight;
				var gap = 10;
				var vw = window.innerWidth;
				var rightRoom = vw - 8 - (rect.right + gap);
				var leftRoom = rect.left - gap - 8;
				var left;
				if (rightRoom >= tipW) {
					// 右侧放得下：默认右上
					left = rect.right + gap;
				} else if (leftRoom >= tipW) {
					// 右侧放不下但左侧够：翻转左上，避免越界
					left = rect.left - tipW - gap;
				} else if (rightRoom >= leftRoom) {
					// 两侧都不够：取空间更大的一侧并尽量贴边
					left = Math.max(8, Math.min(rect.right + gap, vw - tipW - 8));
				} else {
					left = Math.max(8, Math.min(rect.left - tipW - gap, vw - tipW - 8));
				}
				if (left < 8) left = 8;
				if (left + tipW > vw - 8) left = vw - tipW - 8;
				var top = rect.top - tipH + 6;
				if (top < 8) top = 8;
				if (top + tipH > window.innerHeight - 8) {
					top = Math.max(8, window.innerHeight - tipH - 8);
				}
				tip.style.left = left + 'px';
				tip.style.top = top + 'px';
				tip.style.visibility = 'visible';
			}

			function showTip(site, status) {
				closeTip();
				var siteMatch = site.textContent.match(/\d+/);
				var siteNo = siteMatch ? siteMatch[0] : '';
				var nums = (status && Array.isArray(status.freeSocketNumbers) && status.freeSocketNumbers.length > 0)
					? status.freeSocketNumbers
					: null;
				var count = Number(status && status.availableCount);

				if (!nums && !(count > 0)) {
					return;
				}

				tip = document.createElement('div');
				tip.className = 'site-tip';

				if (nums && nums.length > 0) {
					var head = document.createElement('div');
					head.className = 'site-tip-head';
					head.innerHTML = siteNo + '号充电桩 空闲 <span class="site-tip-count">' + nums.length + '</span> 个：';
					tip.appendChild(head);

					var list = document.createElement('div');
					list.className = 'site-tip-list';
					nums.forEach(function (n) {
						var chip = document.createElement('span');
						chip.className = 'site-tip-num';
						chip.textContent = n + '号';
						list.appendChild(chip);
					});
					tip.appendChild(list);
				} else {
					var note = document.createElement('div');
					note.className = 'site-tip-note';
					note.textContent = '该充电桩有 ' + count + ' 个空闲插座（明细暂不可用）';
					tip.appendChild(note);
				}

				var closeBtn = document.createElement('button');
				closeBtn.className = 'site-tip-close';
				closeBtn.type = 'button';
				closeBtn.setAttribute('aria-label', '关闭');
				closeBtn.textContent = '\u00d7';
				closeBtn.addEventListener('click', function (ev) {
					ev.stopPropagation();
					closeTip();
				});
				tip.appendChild(closeBtn);

				document.body.appendChild(tip);
				tipSite = site;
				placeTip(site);
			}

			document.querySelectorAll('.site:not(.empty)').forEach(function (site) {
				site.style.cursor = 'pointer';
				site.addEventListener('click', function (ev) {
					ev.stopPropagation();
					if (site === tipSite) {
						closeTip();
						return;
					}
					var match = site.textContent.match(/\d+/);
					var status = match && states ? states[match[0]] : null;
					if (!status || !status.hasStatus) {
						closeTip();
						return;
					}
					showTip(site, status);
				});
			});

			document.addEventListener('click', function (ev) {
				if (!tip) return;
				if (ev.target && ev.target.closest && (ev.target.closest('.site-tip') || ev.target.closest('.site:not(.empty)'))) {
					return;
				}
				closeTip();
			});

			window.addEventListener('scroll', closeTip, true);
			window.addEventListener('resize', closeTip);
		})();
	</script>
	<script>
		(function () {
			/* 进入地图默认定位到页面底部中间，让图例与提示说明先完整可见，再向上浏览地图 */
			if ('scrollRestoration' in history) {
				history.scrollRestoration = 'manual';
			}
			function scrollToLegend() {
				var doc = document.scrollingElement || document.documentElement;
				var maxTop = doc.scrollHeight - window.innerHeight;
				var maxLeft = doc.scrollWidth - window.innerWidth;
				if (maxTop > 0) {
					/* 垂直滚到底部、水平居中，底部中间的图例可完整露出 */
					window.scrollTo(maxLeft > 0 ? Math.round(maxLeft / 2) : 0, maxTop);
				} else if (maxLeft > 0) {
					window.scrollTo(Math.round(maxLeft / 2), 0);
				}
			}
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', scrollToLegend);
			} else {
				scrollToLegend();
			}
			window.addEventListener('load', scrollToLegend);
		})();
	</script>
</body>
</html>
