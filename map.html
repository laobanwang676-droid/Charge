<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东盟充电桩分布图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            padding: 20px;
            background: #f5f5f5;
        }
        .map-container {
            width: 820px;
            margin: 0 auto;
            background: #fff;
            border: 2px solid #333;
            padding: 30px 20px;
        }
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #d00;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .main-area {
            display: flex;
            height: 700px;
            position: relative;
        }
        /* 左侧马路 */
        .road-left {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            writing-mode: vertical-lr;
        }
        /* 充电区域：几字型过道，左、上、右三边虚线，中间实体放充电桩 */
        .charge-zone {
            flex: 1;
            position: relative;
            margin: 0 10px;
            /* 几字形过道虚线：左、上、右三条边 */
            border-left: 2px dashed #8b4513;
            border-top: 2px dashed #8b4513;
            border-right: 2px dashed #8b4513;
            padding: 12px;
        }
        /* 双列充电桩容器，中间无过道 */
        .pile-wrap {
            display: flex;
            gap: 40px;
            width: 100%;
            height: 100%;
        }
        .charge-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }
        /* 充电桩盒子 */
        .pile-box {
            width: 110px;
            height: 45px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: #fff;
        }
        .pile-empty {
            width: 110px;
            height: 45px;
            border: 1px solid #333;
            background: #fff;
        }
        /* 右侧宿舍 */
        .dorm-right {
            width: 180px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }
        /* 过道文字标注 */
        .text-aisle-left {
            position: absolute;
            left: 4px;
            top: 45%;
            transform: translateY(-50%);
            font-size:18px;
        }
        .text-aisle-top {
            position: absolute;
            top:2px;
            left:50%;
            transform: translateX(-50%);
            font-size:18px;
        }
        .text-aisle-right {
            position: absolute;
            right:4px;
            top:50%;
            transform: translateY(-50%);
            font-size:18px;
        }
        /* 底部保安亭、入口 */
        .bottom-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top:10px;
            padding:0 90px;
        }
        .security-box {
            width:80px;
            height:60px;
            border:2px solid #333;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            font-weight:bold;
        }
        .entrance {
            font-size:20px;
            font-weight:bold;
        }
        .placeholder-right{
            width:80px;
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div class="title">东盟充电桩分布图</div>
        <div class="subtitle">每个充电桩有10个插座</div>

        <div class="main-area">
            <div class="road-left">马路</div>

            <div class="charge-zone">
                <!-- 几字形过道文字：左、顶、右 -->
                <div class="text-aisle-left">过道</div>
                <div class="text-aisle-top">过道</div>
                <div class="text-aisle-right">过道</div>

                <!-- 双列充电桩，中间没有过道 -->
                <div class="pile-wrap">
                    <div class="charge-col">
                        <div class="pile-box">东盟28号充电桩</div>
                        <div class="pile-box">东盟22号充电桩</div>
                        <div class="pile-box">东盟20号充电桩</div>
                        <div class="pile-empty"></div>
                        <div class="pile-box">东盟13号充电桩</div>
                        <div class="pile-box">东盟8号充电桩</div>
                        <div class="pile-box">东盟7号充电桩</div>
                        <div class="pile-box">东盟5号充电桩</div>
                        <div class="pile-box">东盟1号充电桩</div>
                    </div>
                    <div class="charge-col">
                        <div class="pile-box">东盟33号充电桩</div>
                        <div class="pile-box">东盟31号充电桩</div>
                        <div class="pile-box">东盟27号充电桩</div>
                        <div class="pile-box">东盟21号充电桩</div>
                        <div class="pile-box">东盟15号充电桩</div>
                        <div class="pile-box">东盟12号充电桩</div>
                        <div class="pile-box">东盟6号充电桩</div>
                        <div class="pile-box">东盟4号充电桩</div>
                        <div class="pile-box">东盟2号充电桩</div>
                    </div>
                </div>
            </div>

            <div class="dorm-right">20号宿舍</div>
        </div>

        <div class="bottom-area">
            <div class="security-box">保安亭</div>
            <div class="entrance">入口</div>
            <div class="placeholder-right"></div>
        </div>
    </div>
</body>
</html>
