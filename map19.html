<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>19号宿舍充电桩分布图</title>
	<style>
		:root {
			--ink: #111111;
			--line: #8f6a64;
			--dash: #c6a99f;
			--accent: #d92d20;
			--bg: #ffffff;
			--muted: rgba(217, 45, 32, 0.12);
			--panel: #fffaf8;
			--panel-strong: #fff2ec;
			--shadow: 0 12px 30px rgba(115, 72, 62, 0.10);
		}

		* { box-sizing: border-box; }

		@media (max-width: 760px) {
			.page {
				zoom: var(--initial-map-scale, 1);
			}
		}

		html, body {
			margin: 0;
			min-height: 100%;
			background: #f2f2f2;
			color: var(--ink);
			font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
		}

		body {
			display: flex;
			justify-content: center;
			padding: 20px 12px 32px;
		}

		.page {
			width: min(100%, 980px);
			background: linear-gradient(180deg, #fff 0%, #fffdfc 100%);
			padding: 10px 12px 18px;
			position: relative;
			overflow: hidden;
			box-shadow: var(--shadow);
			border: 1px solid rgba(143, 106, 100, 0.12);
			border-radius: 18px;
		}

		.title {
			text-align: center;
			margin: 0;
			font-size: clamp(30px, 4.5vw, 46px);
			line-height: 1.05;
			font-weight: 900;
		}

		.map {
			position: relative;
			width: 100%;
			aspect-ratio: 780 / 1180;
			min-height: 1080px;
			background: #fff;
			margin: 0 auto;
			max-width: 820px;
		}

		/* 第二运动场（底部） */
		.playground {
			position: absolute;
			left: 2%;
			right: 2%;
			bottom: 1.5%;
			height: 8.5%;
			border: 1px solid rgba(143, 106, 100, 0.24);
			border-radius: 16px;
			background: linear-gradient(180deg, var(--panel) 0%, #fff 100%);
			box-shadow: var(--shadow);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.playground span {
			font-size: clamp(28px, 4.5vw, 44px);
			font-weight: 900;
			white-space: nowrap;
		}

		/* 19号宿舍（顶部） */
		.dorm {
			position: absolute;
			left: 2%;
			right: 2%;
			top: 1.5%;
			height: 11%;
			border: 1px solid rgba(143, 106, 100, 0.24);
			border-radius: 20px;
			background: linear-gradient(180deg, var(--panel) 0%, #fff 100%);
			box-shadow: var(--shadow);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.dorm span {
			font-size: clamp(32px, 5vw, 52px);
			line-height: 1.1;
			text-align: center;
			font-weight: 900;
			writing-mode: horizontal-tb;
			text-orientation: mixed;
			white-space: normal;
			word-break: keep-all;
			padding: 0 10px;
		}

		/* 中部充电区域 */
		.charging-area {
			position: absolute;
			left: 2%;
			right: 2%;
			top: 14.5%;
			bottom: 12%;
			display: flex;
			gap: 0;
		}

		/* 列组（2列之间有实线） */
		.column-group {
			display: flex;
			position: relative;
			flex: 1;
		}

		/* 单列 */
		.column {
			display: flex;
			flex-direction: column-reverse;
			gap: 6px;
			padding: 6px 8px;
			flex: 1;
		}

		.column:first-child::after {
			content: '';
			position: absolute;
			top: 2%;
			bottom: 2%;
			right: -1px;
			width: 2px;
			background: var(--line);
		}

		.column-group .column {
			position: relative;
		}

		.site.station-offline { background: #f5b8b3; border-color: #d92d20; }
		.site.station-zero-free { background: #b9d9f5; border-color: #1976d2; }
		.site.station-idle { background: #f1f3f4; border-color: #c5c9cd; color: #111; }

		.map-legend {
			display: flex;
			justify-content: center;
			gap: 16px;
			flex-wrap: wrap;
			margin: 8px auto 0;
			font-size: 12px;
			font-weight: 700;
		}

		.map-legend-item {
			display: inline-flex;
			align-items: center;
			gap: 5px;
		}

		.map-legend-swatch {
			width: 14px;
			height: 14px;
			border: 1px solid rgba(17, 17, 17, 0.2);
			border-radius: 3px;
		}

		.map-legend-swatch.default { background: var(--panel-strong); }
		.map-legend-swatch.idle { background: #f1f3f4; border-color: #c5c9cd; }
		.map-legend-swatch.offline { background: #f5b8b3; border-color: #d92d20; }
		.map-legend-swatch.zero-free { background: #b9d9f5; border-color: #1976d2; }

		/* 竖排插座 */
		.site {
			flex: none;
			height: 68px;
			min-height: 0;
			width: 100%;
			border: 1px solid rgba(143, 106, 100, 0.26);
			background: linear-gradient(180deg, #fff 0%, var(--panel-strong) 100%);
			border-radius: 10px;
			box-shadow: 0 6px 14px rgba(115, 72, 62, 0.08);
			display: flex;
			align-items: center;
			justify-content: center;
			writing-mode: horizontal-tb;
			text-orientation: mixed;
			text-align: center;
			font-size: clamp(11px, 1.4vw, 14px);
			font-weight: 700;
			white-space: normal;
			word-break: break-all;
			line-height: 1.15;
			padding: 0 6px;
			letter-spacing: 0;
		}

		/* 过道 */
		.aisle {
			flex: 0.24;
			background: linear-gradient(180deg, rgba(255, 245, 241, 0.4) 0%, rgba(255, 255, 255, 0.7) 100%);
			border: 1.5px dashed var(--dash);
			border-radius: 14px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 2px;
		}

		.aisle span {
			writing-mode: vertical-rl;
			text-orientation: upright;
			font-size: clamp(14px, 2vw, 20px);
			font-weight: 900;
			color: #111111;
			letter-spacing: 6px;
		}

		.map-return {
			position: fixed;
			left: 16px;
			top: 16px;
			z-index: 50;
			padding: 10px 14px;
			border-radius: 999px;
			border: 1px solid rgba(143, 106, 100, 0.24);
			background: rgba(255, 255, 255, 0.96);
			color: var(--ink);
			font-weight: 900;
			text-decoration: none;
			cursor: pointer;
			appearance: none;
			box-shadow: 0 8px 18px rgba(115, 72, 62, 0.10);
		}

		.map-return:hover {
			background: #fff;
		}

		/* 手机端适配 */
		@media (max-width: 760px) {
			body {
				display: block;
				padding: 0;
				background: #fff;
				overflow-x: auto;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
			}
			.page {
				width: 860px;
				max-width: none;
				padding: 6px 6px 12px;
				border-radius: 0;
				overflow: visible;
			}
			.map {
				width: 820px;
				max-width: none;
				min-height: 1160px;
				aspect-ratio: auto;
			}
			.dorm {
				height: 10%;
			}
			.playground {
				height: 8%;
			}
			.site {
				font-size: clamp(9px, 2.5vw, 12px);
				letter-spacing: 0;
				border-radius: 8px;
				height: 58px;
				width: 100%;
				padding: 0 4px;
			}
			.dorm span {
				font-size: clamp(24px, 7vw, 36px);
				padding: 0 6px;
			}
			.aisle span {
				font-size: clamp(12px, 3vw, 16px);
				letter-spacing: 4px;
			}
		}

		@media (max-width: 480px) {
			body { padding: 4px 2px 12px; }
			.page { padding: 4px 4px 10px; border-radius: 12px; }
			.playground span { font-size: clamp(22px, 6vw, 32px); }
			.site { font-size: 9px; letter-spacing: 0; padding: 4px 2px; }
			.dorm span { font-size: clamp(22px, 6.5vw, 32px); padding: 0 4px; }
			.aisle span { font-size: 11px; letter-spacing: 3px; }
			.map-return {
				left: 10px;
				top: 10px;
				padding: 8px 12px;
				font-size: 12px;
			}
		}
	</style>
</head>
<body>
		<button class="map-return" type="button" onclick="goBackToPreviousPage()">返回</button>
	<main class="page">
		<h1 class="title">东盟充电桩分布图</h1>
		<section class="map" aria-label="19号宿舍充电桩分布图">
			<div class="dorm"><span>19号宿舍</span></div>

			<div class="charging-area">
				<!-- 第1列：69, 70（从下往上） -->
				<div class="column-group">
					<div class="column">
						<div class="site">70号充电桩</div>
						<div class="site">69号充电桩</div>
					</div>

					<!-- 第2列：66, 67, 68（从下往上） -->
					<div class="column">
						<div class="site">68号充电桩</div>
						<div class="site">67号充电桩</div>
						<div class="site">66号充电桩</div>
					</div>
				</div>

				<!-- 过道1 -->
				<div class="aisle"><span>过道</span></div>

				<!-- 第3列：64, 65 / 第4列：58-63 -->
				<div class="column-group">
					<div class="column">
						<div class="site">65号充电桩</div>
						<div class="site">64号充电桩</div>
					</div>
					<div class="column">
						<div class="site">63号充电桩</div>
						<div class="site">62号充电桩</div>
						<div class="site">61号充电桩</div>
						<div class="site">60号充电桩</div>
						<div class="site">59号充电桩</div>
						<div class="site">58号充电桩</div>
					</div>
				</div>

				<!-- 过道2 -->
				<div class="aisle"><span>过道</span></div>

				<!-- 第5列：72,56-48（从下往上） / 第6列：71,40-47,57（从下往上） -->
				<div class="column-group">
					<div class="column">
						<div class="site">48号充电桩</div>
						<div class="site">49号充电桩</div>
						<div class="site">50号充电桩</div>
						<div class="site">51号充电桩</div>
						<div class="site">52号充电桩</div>
						<div class="site">53号充电桩</div>
						<div class="site">54号充电桩</div>
						<div class="site">55号充电桩</div>
						<div class="site">56号充电桩</div>
						<div class="site">72号充电桩</div>
					</div>
					<div class="column">
						<div class="site">57号充电桩</div>
						<div class="site">47号充电桩</div>
						<div class="site">46号充电桩</div>
						<div class="site">45号充电桩</div>
						<div class="site">44号充电桩</div>
						<div class="site">43号充电桩</div>
						<div class="site">42号充电桩</div>
						<div class="site">41号充电桩</div>
						<div class="site">40号充电桩</div>
						<div class="site">71号充电桩</div>
					</div>
				</div>
			</div>

			<div class="playground"><span>第二运动场</span></div>
		</section>
		<div class="map-legend" aria-label="充电桩状态图例">
			<span class="map-legend-item"><i class="map-legend-swatch default"></i>初始状态</span>
			<span class="map-legend-item"><i class="map-legend-swatch idle"></i>有空闲插座</span>
			<span class="map-legend-item"><i class="map-legend-swatch offline"></i>离线</span>
			<span class="map-legend-item"><i class="map-legend-swatch zero-free"></i>0个空闲</span>
		</div>
	</main>
	<script>
		(function () {
			var rawStates = new URLSearchParams(window.location.search).get('states');
			if (rawStates) {
				try {
					var states = JSON.parse(rawStates);
					document.querySelectorAll('.site:not(.empty)').forEach(function (site) {
						var match = site.textContent.match(/\d+/);
						var status = match && states[match[0]];
						if (!status || !status.hasStatus) return;
						if (status.state === '离线') site.classList.add('station-offline');
						else if (Number(status.availableCount) === 0) site.classList.add('station-zero-free');
						else if (status.state === '空闲' || Number(status.availableCount) > 0) site.classList.add('station-idle');
					});
				} catch (_) { /* ignore invalid map state */ }
			}

			function fitMapToViewport() {
				var page = document.querySelector('.page');
				if (!page || window.innerWidth > 760) return;
				var scale = Math.min(1, window.innerWidth / page.offsetWidth);
				page.style.setProperty('--initial-map-scale', String(scale));
			}

			fitMapToViewport();
			window.addEventListener('resize', fitMapToViewport);
		})();

		function goBackToPreviousPage() {
			var referrer = document.referrer;
			var cameFromHome = false;
			try {
				var referrerUrl = referrer ? new URL(referrer, window.location.href) : null;
				cameFromHome = referrerUrl && referrerUrl.origin === window.location.origin
					&& (referrerUrl.pathname.endsWith('/index.html') || referrerUrl.pathname.endsWith('/'));
			} catch (_) {}
			if (cameFromHome && history.length > 1) {
				history.back();
				return;
			}
			window.location.replace('index.html');
		}
	</script>
</body>
</html>
