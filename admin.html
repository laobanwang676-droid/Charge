<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校园充电桩控制台 · 管理员</title>
  <link rel="stylesheet" href="ui/style.css" />
  <link rel="stylesheet" href="ui/admin.css?v=20261122-ios-bg" />
  <script src="features/config.js"></script>
  <script src="features/admin.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>🍊校园充电桩控制台</h1>
        <p class="contact-notice">📱 注册通过、微信群机器人充电、优化建议、bug反馈请加微信：<strong id="wx-id">1944505795</strong><button class="copy-btn" id="copy-wx-btn" type="button" title="复制微信号">复制</button></p>
      </div>
      <div class="topbar-actions">
        <div class="server-status hidden" id="server-status">
          <span class="status-dot checking" id="server-dot"></span>
          <span class="status-text checking" id="server-text">正在检测...</span>
        </div>
        <span class="logged-user hidden" id="logged-user"></span>
        <button class="theme-toggle logout-icon hidden" id="logout-btn" type="button">
          <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" title="切换主题">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="10.5" y="1" width="3" height="4" rx="0.8" fill="currentColor"/>
          <rect x="10.5" y="19" width="3" height="4" rx="0.8" fill="currentColor"/>
          <rect x="1" y="10.5" width="4" height="3" rx="0.8" fill="currentColor"/>
          <rect x="19" y="10.5" width="4" height="3" rx="0.8" fill="currentColor"/>
          <rect x="3.82" y="3.11" width="3" height="4" rx="0.8" fill="currentColor" transform="rotate(-45 5.31 5.11)"/>
          <rect x="17.18" y="16.89" width="3" height="4" rx="0.8" fill="currentColor" transform="rotate(-45 18.69 18.89)"/>
          <rect x="3.82" y="16.89" width="3" height="4" rx="0.8" fill="currentColor" transform="rotate(45 5.31 18.89)"/>
          <rect x="17.18" y="3.11" width="3" height="4" rx="0.8" fill="currentColor" transform="rotate(45 18.69 5.11)"/>
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="notice admin-notice admin-loading" id="admin-status" role="status" aria-live="polite" aria-atomic="true">正在验证管理员身份…</div>

    <main id="admin-main" class="hidden">
      <div class="admin-overview" aria-label="管理概览">
        <div class="admin-metric"><span>待审核账号</span><strong id="pending-count">—</strong></div>
        <div class="admin-metric"><span>白名单账号</span><strong id="whitelist-count">—</strong></div>
        <div class="admin-metric"><span>已加载待确认</span><strong id="unpaid-count">—</strong></div>
      </div>

      <nav class="admin-tabs" role="tablist" aria-label="管理员功能">
        <button class="active" id="tab-records" data-admin-tab="records" type="button" role="tab" aria-selected="true" aria-controls="panel-records">充电订单确认</button>
        <button id="tab-pending" data-admin-tab="pending" type="button" role="tab" aria-selected="false" aria-controls="panel-pending" tabindex="-1">待审核账号</button>
      </nav>

      <section class="panel admin-panel hidden" id="panel-pending" role="tabpanel" aria-labelledby="tab-pending">
        <div class="panel-head admin-section-head">
          <div><h2>账号审核</h2><p class="admin-muted">输入待审核账号，通过后即可使用充电服务。</p></div>
          <button class="btn-secondary" id="refresh-summary" type="button">刷新数量</button>
        </div>
        <div class="panel-body">
          <form class="admin-pending-form" id="pending-form">
            <div class="field"><label for="pending-phone">待审核账号</label><input id="pending-phone" type="text" inputmode="numeric" pattern="[0-9]{11}" minlength="11" maxlength="11" placeholder="输入 11 位手机号" autocomplete="off" required /></div>
            <button class="btn-primary" type="submit" id="approve-account">添加到白名单</button>
          </form>
          <p class="admin-muted admin-form-help">审核后保留用户原密码；需要查找账号时，可展开下方列表。</p>
          <div class="admin-pending-tools">
            <button class="btn-secondary" id="pending-toggle" type="button" aria-expanded="false" aria-controls="pending-list">查看所有待审核</button>
            <button class="btn-secondary hidden" id="pending-refresh" type="button">刷新待审核列表</button>
          </div>
          <div class="admin-list hidden" id="pending-list"></div>
        </div>
      </section>

      <section class="panel admin-panel" id="panel-records" role="tabpanel" aria-labelledby="tab-records">
        <div class="panel-head admin-section-head">
          <div><h2>充电订单确认</h2><p class="admin-muted">核对订单信息后确认，误操作可撤销。</p></div>
          <button class="btn-secondary" data-refresh="records" type="button">刷新记录</button>
        </div>
        <div class="panel-body">
          <div class="admin-record-tools">
            <div class="field"><label for="record-limit">最近记录条数</label><select id="record-limit"><option value="20">最近 20 条</option><option value="50">最近 50 条</option><option value="100">最近 100 条</option><option value="200">最近 200 条</option></select></div>
            <div class="field"><label for="record-filter">确认状态</label><select id="record-filter"><option value="all">全部状态</option><option value="unpaid">待确认</option><option value="paid">已确认</option></select></div>
            <div class="field"><label for="record-search">查找账号</label><input id="record-search" type="search" placeholder="输入手机号查找" /></div>
          </div>
          <p id="record-summary" class="admin-muted"></p>
          <div class="admin-list" id="record-list"><p class="admin-empty admin-loading">正在准备最近 20 条记录…</p></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
