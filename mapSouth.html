<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>学术交流中心（南门）充电桩分布</title>
	<style>
		:root {
			--ink: #111111;
			--line: #8f6a64;
			--dash: #c6a99f;
			--accent: #d92d20;
			--bg: #ffffff;
			--muted: rgba(217, 45, 32, 0.12);
			--panel: #fffaf8;
			--panel-strong: #fff2ec;
			--shadow: 0 12px 30px rgba(115, 72, 62, 0.10);
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			min-height: 100%;
			background: #f2f2f2;
			color: var(--ink);
			font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
		}

		body {
			display: flex;
			justify-content: center;
			padding: 20px 12px 32px;
		}

		.page {
			width: min(100%, 980px);
			min-height: calc(100vh - 52px);
			background: linear-gradient(180deg, #fff 0%, #fffdfc 100%);
			padding: 10px 12px 18px;
			position: relative;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			justify-content: center;
			box-shadow: var(--shadow);
			border: 1px solid rgba(143, 106, 100, 0.12);
			border-radius: 18px;
		}

		.title {
			text-align: center;
			margin: 0;
			font-size: clamp(20px, 5.5vw, 46px);
			line-height: 1.15;
			font-weight: 900;
			letter-spacing: 0;
			color: var(--ink);
			padding: 0 4px;
			overflow-wrap: break-word;
		}

		.map-return {
			position: fixed;
			left: 16px;
			top: 16px;
			z-index: 50;
			padding: 10px 14px;
			border-radius: 999px;
			border: 1px solid rgba(143, 106, 100, 0.24);
			background: rgba(255, 255, 255, 0.96);
			color: var(--ink);
			font-weight: 900;
			text-decoration: none;
			cursor: pointer;
			appearance: none;
			box-shadow: 0 8px 18px rgba(115, 72, 62, 0.10);
		}

		.map-return:hover {
			background: #fff;
		}

		/* ========== 充电桩区域 ========== */
		.charging-area {
			position: relative;
			width: 100%;
			max-width: 780px;
			margin: 40px auto 0;
			padding-left: 110px;
		}

		/* 校南门标记 */
		.south-gate {
			position: absolute;
			left: 0;
			top: 0;
			width: 96px;
			/* 通过 JS 设置高度，覆盖两行 + 间距 */
			border: 1px solid rgba(143, 106, 100, 0.24);
			border-radius: 18px;
			background: linear-gradient(180deg, var(--panel) 0%, #fff 100%);
			box-shadow: var(--shadow);
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		.south-gate span {
			font-weight: 900;
			font-size: clamp(16px, 2.4vw, 24px);
			writing-mode: vertical-rl;
			text-orientation: upright;
			letter-spacing: 4px;
			max-height: 100%;
		}

		/* 行容器 */
		.station-row {
			display: flex;
			gap: 14px;
			justify-content: flex-start;
		}

		.station-row + .station-row {
			margin-top: 30px;
		}

		/* 充电桩卡片 */
		.site {
			flex: 1;
			min-width: 0;
			height: 64px;
			border: 1px solid rgba(143, 106, 100, 0.26);
			background: linear-gradient(180deg, #fff 0%, var(--panel-strong) 100%);
			border-radius: 12px;
			box-shadow: 0 8px 18px rgba(115, 72, 62, 0.08);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: clamp(11px, 2.8vw, 14px);
			line-height: 1;
			white-space: nowrap;
			font-weight: 600;
			overflow: hidden;
			text-overflow: ellipsis;
			padding: 0 2px;
		}

		.site.station-offline { background: #f5b8b3; border-color: #d92d20; }
		.site.station-zero-free { background: #b9d9f5; border-color: #1976d2; }
		.site.station-idle { background: #f1f3f4; border-color: #c5c9cd; color: #111; }

		.map-legend {
			display: flex;
			justify-content: center;
			gap: 16px;
			flex-wrap: wrap;
			margin: 8px auto 0;
			font-size: 12px;
			font-weight: 700;
		}

		.map-legend-item {
			display: inline-flex;
			align-items: center;
			gap: 5px;
		}

		.map-legend-swatch {
			width: 14px;
			height: 14px;
			border: 1px solid rgba(17, 17, 17, 0.2);
			border-radius: 3px;
		}

		.map-legend-swatch.default { background: var(--panel-strong); }
		.map-legend-swatch.idle { background: #f1f3f4; border-color: #c5c9cd; }
		.map-legend-swatch.offline { background: #f5b8b3; border-color: #d92d20; }
		.map-legend-swatch.zero-free { background: #b9d9f5; border-color: #1976d2; }

		.site.empty {
			background: linear-gradient(180deg, #fff 0%, #fff9f7 100%);
			border-style: dashed;
			box-shadow: none;
		}

		/* 校内标注 - 黑体 */
		.campus-label {
			text-align: center;
			margin-top: 36px;
			font-weight: 900;
			font-family: "SimHei", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
			font-size: clamp(22px, 5vw, 40px);
			color: var(--ink);
			letter-spacing: 2px;
		}

		/* ========== 响应式 - 手机端优先 ========== */
		@media (max-width: 480px) {
			body {
				display: block;
				padding: 0;
				background: #fff;
				overflow-x: auto;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
			}
			.page {
				width: 860px;
				max-width: none;
				min-height: 100vh;
				padding: 6px 6px 14px;
				box-shadow: none;
				border-radius: 0;
				overflow: visible;
			}
			.title {
				font-size: 17px;
				line-height: 1.3;
			}
			.charging-area {
				width: 780px;
				max-width: none;
				padding-left: 60px;
				margin-top: 18px;
			}
			.south-gate {
				width: 50px;
				border-radius: 12px;
			}
			.south-gate span {
				font-size: 13px;
				letter-spacing: 2px;
			}
			.station-row {
				gap: 5px;
			}
			.station-row + .station-row {
				margin-top: 14px;
			}
			.site {
				height: 44px;
				font-size: 10px;
				border-radius: 8px;
				padding: 0 1px;
			}
			.site.empty {
				display: none;
			}
			.station-row#row2 {
				padding-left: 0;
				margin-left: calc((100% / 6) + 5px / 6);
			}
			.station-row#row2 .site {
				flex: 1;
			}
			.campus-label {
				font-size: 20px;
				margin-top: 22px;
			}
		}

		@media (min-width: 481px) and (max-width: 760px) {
			body { padding: 0; background: #fff; }
			.page {
				width: 100%;
				min-height: 100vh;
				padding: 6px 8px 14px;
				box-shadow: none;
				border-radius: 0;
			}
			.charging-area {
				padding-left: 72px;
				margin-top: 24px;
			}
			.south-gate {
				width: 60px;
			}
			.south-gate span {
				font-size: 15px;
				letter-spacing: 3px;
			}
			.station-row {
				gap: 8px;
			}
			.station-row + .station-row {
				margin-top: 20px;
			}
			.site {
				height: 50px;
				font-size: 11px;
				border-radius: 10px;
			}
			.campus-label {
				font-size: 24px;
				margin-top: 28px;
			}
			.map-return {
				left: 10px;
				top: 10px;
				padding: 8px 12px;
				font-size: 12px;
			}
		}
		/* 站点文字下方的空闲数角标 */
		.site {
			flex-direction: column;
		}

		.site .site-free {
			display: block;
			flex: none;
			width: 100%;
			min-height: 0;
			margin-top: 2px;
			color: #1976d2;
			font-size: 0.85em;
			font-weight: 900;
			line-height: 1.05;
			letter-spacing: 0;
			text-align: center;
			white-space: nowrap;
		}

		/* 点击站点弹出的空闲插座气泡 */
		.site-tip {
			position: fixed;
			z-index: 9999;
			min-width: 96px;
			max-width: 230px;
			box-sizing: border-box;
			padding: 9px 22px 9px 11px;
			background: #ffffff;
			border: 1px solid rgba(25, 118, 210, 0.35);
			border-radius: 10px;
			box-shadow: 0 10px 24px rgba(17, 17, 17, 0.18);
			font-size: 12px;
			font-weight: 700;
			line-height: 1.4;
			color: #111;
		}

		.site-tip-head {
			margin-bottom: 5px;
			font-size: 13px;
		}

		.site-tip-head .site-tip-count {
			color: #1976d2;
		}

		.site-tip-list {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}

		.site-tip-num {
			display: inline-block;
			padding: 1px 6px;
			border-radius: 6px;
			background: #e7f1fd;
			color: #0b5cad;
			font-size: 12px;
			font-weight: 800;
		}

		.site-tip-note {
			color: #666;
			font-weight: 600;
		}

		.site-tip-close {
			position: absolute;
			top: 4px;
			right: 4px;
			width: 20px;
			height: 20px;
			padding: 0;
			border: none;
			border-radius: 50%;
			background: transparent;
			color: #999;
			font-size: 16px;
			font-weight: 700;
			line-height: 20px;
			text-align: center;
			cursor: pointer;
		}

		.site-tip-close:hover {
			background: rgba(17, 17, 17, 0.08);
			color: #111;
		}

		/* 点击查看空闲插座提示 */
		.map-hint {
			margin-top: 10px;
			font-size: 12px;
			font-family: "SimHei", "Microsoft YaHei", sans-serif;
			font-weight: 700;
			color: #0d47a1;
			text-align: center;
		}
	</style>
</head>
<body>
		<button class="map-return" type="button" onclick="goBackToPreviousPage()">返回</button>
	<main class="page">
		<h1 class="title">学术交流中心（南门）充电桩分布</h1>

		<section class="charging-area" aria-label="南门充电桩分布图">
			<!-- 校南门标记 -->
			<div class="south-gate" id="southGate"><span>校南门</span></div>

			<!-- 第一行：74 ~ 79 -->
			<div class="station-row" id="row1">
			<div class="site">74号充电桩</div>
			<div class="site">75号充电桩</div>
			<div class="site">76号充电桩</div>
			<div class="site">77号充电桩</div>
			<div class="site">78号充电桩</div>
			<div class="site">79号充电桩</div>
			</div>

			<!-- 第二行：36 ~ 39，向右偏移一个卡片宽度 -->
			<div class="station-row" id="row2">
				<div class="site empty"></div>
			<div class="site">36号充电桩</div>
			<div class="site">37号充电桩</div>
			<div class="site">38号充电桩</div>
			<div class="site">39号充电桩</div>
				<div class="site empty"></div>
			</div>
		</section>

		<div class="campus-label">校内</div>
		<div class="map-legend" aria-label="充电桩状态图例">
			<span class="map-legend-item"><i class="map-legend-swatch default"></i>初始状态</span>
			<span class="map-legend-item"><i class="map-legend-swatch idle"></i>有空闲插座</span>
			<span class="map-legend-item"><i class="map-legend-swatch offline"></i>离线</span>
			<span class="map-legend-item"><i class="map-legend-swatch zero-free"></i>0个空闲</span>
		</div>
		<div class="map-hint">点击有空闲的充电桩，可查看具体是哪些插座空闲</div>
	</main>

	<script>
		(function () {
			var rawStates = new URLSearchParams(window.location.search).get('states');
			if (rawStates) {
				try {
					var states = JSON.parse(rawStates);
					document.querySelectorAll('.site:not(.empty)').forEach(function (site) {
						var match = site.textContent.match(/\d+/);
						var status = match && states[match[0]];
						if (!status || !status.hasStatus) return;
						if (status.state === '离线') site.classList.add('station-offline');
						else if (Number(status.availableCount) === 0) site.classList.add('station-zero-free');
						else if (status.state === '空闲' || Number(status.availableCount) > 0) site.classList.add('station-idle');
					});
				} catch (_) { /* ignore invalid map state */ }
			}

		})();

		function goBackToPreviousPage() {
			var referrer = document.referrer;
			var cameFromHome = false;
			try {
				var referrerUrl = referrer ? new URL(referrer, window.location.href) : null;
				cameFromHome = referrerUrl && referrerUrl.origin === window.location.origin
					&& (referrerUrl.pathname.endsWith('/index.html') || referrerUrl.pathname.endsWith('/'));
			} catch (_) {}
			if (cameFromHome && history.length > 1) {
				history.back();
				return;
			}
			window.location.replace('index.html');
		}

		// 让小南门标记的高度精确覆盖两行充电桩
		(function () {
			function adjustGate() {
				var row1 = document.getElementById('row1');
				var row2 = document.getElementById('row2');
				var gate = document.getElementById('southGate');
				if (!row1 || !row2 || !gate) return;

				var top = row1.offsetTop;
				var bottom = row2.offsetTop + row2.offsetHeight;
				gate.style.top = top + 'px';
				gate.style.height = (bottom - top) + 'px';
			}

			adjustGate();
			window.addEventListener('resize', adjustGate);
		})();
	</script>
	<script>
		(function () {
			var rawStates = new URLSearchParams(window.location.search).get('states');
			if (!rawStates) return;
			var states = null;
			try { states = JSON.parse(rawStates); } catch (_) { return; }
			document.querySelectorAll('.site:not(.empty)').forEach(function (site) {
				var match = site.textContent.match(/\d+/);
				var status = match && states[match[0]];
				if (!status || !status.hasStatus) return;
				var freeCount = Number(status.availableCount);
				if (!(freeCount > 0)) return;
				var badge = document.createElement('span');
				badge.className = 'site-free';
				badge.textContent = '空闲数' + freeCount;
				site.appendChild(badge);
			});
		})();
	</script>
	<script>
		(function () {
			var rawStates = new URLSearchParams(window.location.search).get('states');
			var states = null;
			if (rawStates) {
				try { states = JSON.parse(rawStates); } catch (_) { states = null; }
			}

			var tip = null;
			var tipSite = null;

			function closeTip() {
				if (tip) {
					tip.remove();
					tip = null;
				}
				tipSite = null;
			}

			function placeTip(site) {
				if (!tip) return;
				var rect = site.getBoundingClientRect();
				tip.style.visibility = 'hidden';
				tip.style.left = '0px';
				tip.style.top = '0px';
				var tipW = tip.offsetWidth;
				var tipH = tip.offsetHeight;
				var gap = 10;
				var vw = window.innerWidth;
				var rightRoom = vw - 8 - (rect.right + gap);
				var leftRoom = rect.left - gap - 8;
				var left;
				if (rightRoom >= tipW) {
					// 右侧放得下：默认右上
					left = rect.right + gap;
				} else if (leftRoom >= tipW) {
					// 右侧放不下但左侧够：翻转左上，避免越界
					left = rect.left - tipW - gap;
				} else if (rightRoom >= leftRoom) {
					// 两侧都不够：取空间更大的一侧并尽量贴边
					left = Math.max(8, Math.min(rect.right + gap, vw - tipW - 8));
				} else {
					left = Math.max(8, Math.min(rect.left - tipW - gap, vw - tipW - 8));
				}
				if (left < 8) left = 8;
				if (left + tipW > vw - 8) left = vw - tipW - 8;
				var top = rect.top - tipH + 6;
				if (top < 8) top = 8;
				if (top + tipH > window.innerHeight - 8) {
					top = Math.max(8, window.innerHeight - tipH - 8);
				}
				tip.style.left = left + 'px';
				tip.style.top = top + 'px';
				tip.style.visibility = 'visible';
			}

			function showTip(site, status) {
				closeTip();
				var siteMatch = site.textContent.match(/\d+/);
				var siteNo = siteMatch ? siteMatch[0] : '';
				var nums = (status && Array.isArray(status.freeSocketNumbers) && status.freeSocketNumbers.length > 0)
					? status.freeSocketNumbers
					: null;
				var count = Number(status && status.availableCount);

				if (!nums && !(count > 0)) {
					return;
				}

				tip = document.createElement('div');
				tip.className = 'site-tip';

				if (nums && nums.length > 0) {
					var head = document.createElement('div');
					head.className = 'site-tip-head';
					head.innerHTML = siteNo + '号充电桩 空闲 <span class="site-tip-count">' + nums.length + '</span> 个：';
					tip.appendChild(head);

					var list = document.createElement('div');
					list.className = 'site-tip-list';
					nums.forEach(function (n) {
						var chip = document.createElement('span');
						chip.className = 'site-tip-num';
						chip.textContent = n + '号';
						list.appendChild(chip);
					});
					tip.appendChild(list);
				} else {
					var note = document.createElement('div');
					note.className = 'site-tip-note';
					note.textContent = '该充电桩有 ' + count + ' 个空闲插座（明细暂不可用）';
					tip.appendChild(note);
				}

				var closeBtn = document.createElement('button');
				closeBtn.className = 'site-tip-close';
				closeBtn.type = 'button';
				closeBtn.setAttribute('aria-label', '关闭');
				closeBtn.textContent = '\u00d7';
				closeBtn.addEventListener('click', function (ev) {
					ev.stopPropagation();
					closeTip();
				});
				tip.appendChild(closeBtn);

				document.body.appendChild(tip);
				tipSite = site;
				placeTip(site);
			}

			document.querySelectorAll('.site:not(.empty)').forEach(function (site) {
				site.style.cursor = 'pointer';
				site.addEventListener('click', function (ev) {
					ev.stopPropagation();
					if (site === tipSite) {
						closeTip();
						return;
					}
					var match = site.textContent.match(/\d+/);
					var status = match && states ? states[match[0]] : null;
					if (!status || !status.hasStatus) {
						closeTip();
						return;
					}
					showTip(site, status);
				});
			});

			document.addEventListener('click', function (ev) {
				if (!tip) return;
				if (ev.target && ev.target.closest && (ev.target.closest('.site-tip') || ev.target.closest('.site:not(.empty)'))) {
					return;
				}
				closeTip();
			});

			window.addEventListener('scroll', closeTip, true);
			window.addEventListener('resize', closeTip);
		})();
	</script>
	<script>
		(function () {
			/* 进入地图默认定位到页面底部，让图例与提示说明先可见，再向上浏览地图 */
			if ('scrollRestoration' in history) {
				history.scrollRestoration = 'manual';
			}
			function scrollToLegend() {
				var doc = document.scrollingElement || document.documentElement;
				var maxTop = doc.scrollHeight - window.innerHeight;
				if (maxTop > 0) {
					window.scrollTo(0, maxTop);
				}
			}
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', scrollToLegend);
			} else {
				scrollToLegend();
			}
			window.addEventListener('load', scrollToLegend);
		})();
	</script>
</body>
</html>
